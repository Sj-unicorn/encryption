<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>資安小達人</title>
<style>
:root{
  --navy:#17283f;--muted:#65778a;--blue:#dff3ff;--blue2:#61bfee;
  --pink:#ffe7f1;--yellow:#fff4bd;--green:#dcf8e7;--red:#ffe2e2;
  --lav:#eee8ff;--line:#d7e2eb;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--navy);background:#fff}
body{background:radial-gradient(circle at 7% 7%,#fff0f3 0 90px,transparent 91px),radial-gradient(circle at 94% 92%,#eaf7ff 0 105px,transparent 106px),#fff}
button,input{font:inherit}.hidden{display:none!important}
.wrap{width:min(1120px,96vw);margin:18px auto 34px}.card{background:#fff;border:3px solid var(--navy);border-radius:22px;box-shadow:0 8px 0 rgba(23,40,63,.1)}
.entry{padding:28px;text-align:center}.entry h1{font-size:clamp(34px,5vw,52px);margin:0 0 8px}.entry>p{margin:0;color:var(--muted);font-weight:800}
.entry-box{width:min(560px,100%);margin:22px auto 0;border:3px solid var(--navy);border-radius:20px;background:#f8fbfd;padding:20px}
.entry-box label{display:block;font-weight:1000;margin-bottom:8px}.entry-box input{width:100%;border:3px solid var(--navy);border-radius:13px;padding:13px 14px;font-size:18px;text-align:center}
.entry-help{margin:8px 0 14px;color:var(--muted);font-size:13px;font-weight:800;line-height:1.5}.error{color:#b52626;font-weight:900;margin-top:10px}
.btn{border:3px solid var(--navy);border-radius:14px;padding:11px 18px;background:#fff;color:var(--navy);font-weight:1000;cursor:pointer}.btn.primary{background:var(--navy);color:#fff}.btn.warn{background:var(--yellow)}.btn.good{background:var(--green)}.btn:disabled{opacity:.5;cursor:not-allowed}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.small{font-size:13px;color:var(--muted);font-weight:800}.panel{padding:18px}
.teacher-folder{border:3px solid var(--navy);border-radius:18px;margin-top:14px;overflow:hidden;background:#fff}.teacher-folder summary{cursor:pointer;padding:15px 17px;font-size:21px;font-weight:1000;background:#f5f8fc;list-style:none}.teacher-folder summary::-webkit-details-marker{display:none}.teacher-folder summary::after{content:"▼";float:right;font-size:16px;transition:.2s}.teacher-folder[open] summary::after{transform:rotate(180deg)}.folder-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 0}.teacher-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;margin-top:0}.station-btn{border:3px solid var(--navy);border-radius:18px;padding:18px;text-align:left;background:#fff;cursor:pointer;position:relative}.station-btn.active{background:var(--green);outline:5px solid #8ae1ac}.station-btn.easy-card{background:#f5fbff}.station-btn.hard-card{background:#fff8f2}.station-btn.easy-card.active,.station-btn.hard-card.active{background:var(--green)}.station-btn .ico{font-size:38px}.station-btn b{display:block;font-size:21px;margin:5px 0}.station-btn .check{position:absolute;right:14px;top:14px;font-size:25px;opacity:0}.station-btn.active .check{opacity:1}
.status{border:3px solid var(--navy);border-radius:18px;background:#f7fafc;padding:16px;text-align:center;font-weight:1000}.sync{margin-top:10px;padding:9px 12px;border-radius:12px;background:#eef7ff;border:2px solid #b8dff7;font-size:13px;font-weight:900;text-align:center}
.wait{padding:38px 18px;text-align:center}.wait .ico{font-size:78px}.wait h2{font-size:30px;margin:8px 0}.wait p{color:var(--muted);font-weight:800}
.menu{padding:18px}.menu h2{margin:0 0 6px;text-align:center}.menu>p{margin:0 0 16px;text-align:center;color:var(--muted);font-weight:800}.student-game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.student-game-btn{border:3px solid var(--navy);border-radius:18px;padding:18px;text-align:left;background:#fff;cursor:pointer}.student-game-btn.easy-card{background:#f5fbff}.student-game-btn.hard-card{background:#fff8f2}.student-game-btn .ico{font-size:38px}.student-game-btn b{display:block;font-size:20px;margin:5px 0}
.external-wrap{overflow:hidden}.external-head{padding:12px 16px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.external-frame{width:100%;height:1250px;border:0;background:#fff;display:block}
.game-card{overflow:hidden}.game-head{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.game-title{font-size:23px;font-weight:1000}.game-sub{font-size:13px;color:var(--muted);font-weight:800}.pill{border:3px solid var(--navy);border-radius:999px;padding:8px 14px;background:var(--yellow);font-weight:1000}.progress{height:14px;background:#e8eef4;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}.progress>div{height:100%;background:var(--blue2);width:0;transition:.25s}
.game{padding:18px}.patternbox{border:3px solid #d0b43e;border-radius:18px;background:var(--yellow);padding:14px}.patternrow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.patternchip{border:3px solid var(--navy);border-radius:13px;padding:9px 13px;background:#fff;font-size:18px;font-weight:1000;letter-spacing:1px}.step{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}.stepno{width:34px;height:34px;border:3px solid var(--navy);border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:1000}
.challenge{margin-top:16px;border:3px solid var(--navy);border-radius:20px;background:#f8fbfe;padding:18px;text-align:center}.cipher{font-size:clamp(30px,5vw,50px);font-weight:1000;letter-spacing:5px;margin:8px 0 16px;word-break:break-word}.answerbox label{display:block;font-size:16px;font-weight:900;margin-bottom:7px}#answer{width:min(680px,100%);font-size:25px;font-weight:900;text-transform:uppercase;border:3px solid var(--navy);border-radius:15px;padding:12px 15px;text-align:center;outline:none}.keyboard{max-width:850px;margin:15px auto 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.key{min-width:48px;height:46px;border:2px solid var(--navy);border-radius:10px;background:#fff;font-weight:1000;cursor:pointer}.key.special{min-width:80px;background:#f2f6fa}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.feedback{margin-top:15px;border:3px solid var(--line);border-radius:17px;padding:13px 16px;min-height:72px;background:#f8fafc;line-height:1.55}.feedback.good{background:var(--green);border-color:#72d99b}.feedback.bad{background:var(--red);border-color:#eb8585}.feedback.info{background:#fff8d7;border-color:#dec15c}
@media(max-width:760px){.teacher-grid,.student-game-grid{grid-template-columns:1fr}.key{min-width:43px;height:43px}.external-frame{height:1500px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="entryView" class="card entry">
    <h1>🔐 資安小達人</h1>
    <p>進入課堂後，學生只能看到老師目前開放的遊戲。</p>
    <div class="entry-box">
      <label for="entryPassword">教師密碼</label>
      <input type="password" id="entryPassword" autocomplete="current-password" placeholder="學生請留空">
      <div class="entry-help">學生：密碼留空直接進入。<br>教師：輸入教師密碼後進入操控台。</div>
      <button class="btn primary" id="enterBtn">進入課堂 ▶</button>
      <div class="error" id="entryError"></div>
    </div>
  </section>

  <section id="teacherView" class="hidden">
    <div class="topline">
      <div><h1 style="margin:0">👩‍🏫 教師操控台</h1><div class="small">可以同時開放多個遊戲；學生端會即時同步。</div></div>
      <div><button class="btn" id="teacherLogout">登出</button><button class="btn" id="backEntry1">回首頁</button></div>
    </div>
    <div class="card panel">
      <div class="status" id="teacherStatus">目前開放：讀取中…</div>
      <details class="teacher-folder">
        <summary>📁 第一堂｜網路安全大冒險</summary>
        <div class="folder-actions">
          <button class="btn" id="lesson1Open">第一堂全部開放</button>
          <button class="btn" id="lesson1Close">第一堂全部關閉</button>
        </div>
        <div class="teacher-grid">
          <button class="station-btn" data-mode="cia_arcade"><span class="check">✅</span><span class="ico">🎮</span><b>資安三原則街機挑戰</b><span>機密性・完整性・可用性</span></button>
          <button class="station-btn" data-mode="password_strength"><span class="check">✅</span><span class="ico">🔐</span><b>我的密碼安全嗎？</b><span>密碼強度・破解時間估算</span></button>
          <button class="station-btn" data-mode="digital_safety"><span class="check">✅</span><span class="ico">🛡️</span><b>數位安全服務處</b><span>釣魚・陌生請求・安全判斷</span></button>
        </div>
      </details>

      <details class="teacher-folder">
        <summary>📁 第二堂｜古典密碼學基礎</summary>
        <div class="folder-actions"><button class="btn" id="lesson2Open">第二堂全部開放</button><button class="btn" id="lesson2Close">第二堂全部關閉</button></div>
        <div class="teacher-grid">
          <button class="station-btn" data-mode="judgment"><span class="check">✅</span><span class="ico">🕵️</span><b>密碼學判斷站</b><span>25 題｜明文・密文・加密・解密</span></button>
          <button class="station-btn" data-mode="secretclue"><span class="check">✅</span><span class="ico">👑</span><b>誰拿得到秘密？</b><span>25 題｜線索推理任務</span></button>
          <button class="station-btn easy-card" data-mode="caesar_easy"><span class="check">✅</span><span class="ico">🔤</span><b>凱薩位移｜簡單</b><span>10 題｜3～4 個字母</span></button>
          <button class="station-btn hard-card" data-mode="caesar_hard"><span class="check">✅</span><span class="ico">🔤</span><b>凱薩位移｜困難</b><span>10 題｜5～6 個字母</span></button>
          <button class="station-btn easy-card" data-mode="substitution_easy"><span class="check">✅</span><span class="ico">🔁</span><b>替換字母｜簡單</b><span>10 題｜3～4 個字母</span></button>
          <button class="station-btn hard-card" data-mode="substitution_hard"><span class="check">✅</span><span class="ico">🔁</span><b>替換字母｜困難</b><span>10 題｜5～6 個字母</span></button>
          <button class="station-btn easy-card" data-mode="reverse_easy"><span class="check">✅</span><span class="ico">🔄</span><b>反轉密碼｜簡單</b><span>10 題｜3～4 個字母</span></button>
          <button class="station-btn hard-card" data-mode="reverse_hard"><span class="check">✅</span><span class="ico">🔄</span><b>反轉密碼｜困難</b><span>10 題｜5～6 個字母</span></button>
          <button class="station-btn easy-card" data-mode="mixed_easy"><span class="check">✅</span><span class="ico">🧠</span><b>混合挑戰｜簡單</b><span>10 題｜3～4 個字母</span></button>
          <button class="station-btn hard-card" data-mode="mixed_hard"><span class="check">✅</span><span class="ico">🧠</span><b>混合挑戰｜困難</b><span>10 題｜5～6 個字母</span></button>
        </div>
      </details>

      <details class="teacher-folder">
        <summary>📁 第三堂｜古典密碼學進階</summary>
        <div class="folder-actions"><button class="btn" id="lesson3EasyOpen">第三堂簡單全部開放</button><button class="btn" id="lesson3HardOpen">第三堂困難全部開放</button><button class="btn" id="lesson3Close">第三堂全部關閉</button></div>
        <div class="teacher-grid">
          <button class="station-btn easy-card" data-mode="playfair_easy"><span class="check">✅</span><span class="ico">▦</span><b>Playfair｜簡單</b><span>10 題｜4 個字母以內</span></button>
          <button class="station-btn hard-card" data-mode="playfair_hard"><span class="check">✅</span><span class="ico">▦</span><b>Playfair｜困難</b><span>10 題｜5 個字母以上</span></button>
          <button class="station-btn easy-card" data-mode="suzhou_easy"><span class="check">✅</span><span class="ico">〧</span><b>蘇州碼子｜簡單</b><span>10 題｜每題 3 個</span></button>
          <button class="station-btn hard-card" data-mode="suzhou_hard"><span class="check">✅</span><span class="ico">〧</span><b>蘇州碼子｜困難</b><span>10 題｜每題 4 個</span></button>
          <button class="station-btn easy-card" data-mode="bookcipher_easy"><span class="check">✅</span><span class="ico">📚</span><b>書冊加密｜簡單</b><span>10 題｜2～3 字詞</span></button>
          <button class="station-btn hard-card" data-mode="bookcipher_hard"><span class="check">✅</span><span class="ico">📚</span><b>書冊加密｜困難</b><span>10 題｜4 字以上</span></button>
          <button class="station-btn easy-card" data-mode="suzhoubook_easy"><span class="check">✅</span><span class="ico">🗝️</span><b>蘇州碼子 × 書冊｜簡單</b><span>10 題｜2～3 字詞</span></button>
          <button class="station-btn hard-card" data-mode="suzhoubook_hard"><span class="check">✅</span><span class="ico">🗝️</span><b>蘇州碼子 × 書冊｜困難</b><span>10 題｜4 字以上</span></button>
        </div>
      </details>

      <div class="actions">
        <button class="btn warn" id="lockAll">🔒 全部關閉</button>
        <button class="btn good" id="openAll">🎮 全部開放</button>
      </div>
      <div class="sync" id="teacherSync">☁️ 正在連線 Firebase…</div>
    </div>
  </section>

  <section id="studentView" class="hidden">
    <div class="topline">
      <div><h1 style="margin:0">🎒 學生遊戲區</h1><div class="small">老師開放哪些遊戲，這裡就會出現哪些遊戲。</div></div>
      <button class="btn" id="backEntry2">回首頁</button>
    </div>

    <div id="waitingCard" class="card wait">
      <div class="ico">🔒</div><h2>目前還沒有開放遊戲</h2>
      <p>請等待老師開放遊戲。</p><div class="sync">☁️ 已連線，等待教師指令</div>
    </div>

    <div id="gameMenu" class="card menu hidden">
      <h2>🎮 選擇遊戲</h2><p id="menuHint">老師目前開放以下遊戲。</p>
      <div class="student-game-grid" id="studentGameGrid"></div>
    </div>

    <div id="externalGameWrap" class="card external-wrap hidden">
      <div class="external-head">
        <div><b id="externalGameTitle">遊戲</b><div class="small">老師目前開放的遊戲</div></div>
        <button class="btn" id="backMenuExternal">← 回遊戲選單</button>
      </div>
      <iframe id="externalGameFrame" class="external-frame" title="課堂遊戲"></iframe>
    </div>

    <div id="gameCard" class="card game-card hidden">
      <div class="game-head">
        <div><div class="game-title" id="gameTitle"></div><div class="game-sub" id="gameSub"></div></div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn" id="backMenuBuiltIn">← 回遊戲選單</button><div class="pill"><span id="gameScore">0</span> 分</div></div>
      </div>
      <div class="progress"><div id="gameProgress"></div></div>
      <div class="game">
        <div class="patternbox"><div id="patternRow" class="patternrow"></div></div>
        <div class="challenge">
          <div class="cipher" id="cipherText"></div>
          <div class="answerbox"><label for="answer">答案</label><input id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入英文單字"></div>
          <div class="keyboard" id="keyboard"></div>
          <div class="actions"><button class="btn" id="clearBtn">↻ 清除</button><button class="btn primary" id="checkBtn">確定答案 ✓</button><button class="btn primary hidden" id="nextBtn">下一題 ▶</button></div>
          <div class="feedback info" id="feedback">觀察上面的規則，再解開密文。</div>
        </div>
      </div>
    </div>
  </section>
</div>

<script type="module">

 apiKey:"AIzaSyAERc_2OjW57wOjcagQyHUREkEYPji_pGo",

const wordSets={
 caesar:["CAT","DOG","SUN","MAP","BOX","BOOK","GAME","STAR","MOON","FISH","APPLE","WATER","HAPPY","HOUSE","LIGHT","SCHOOL","FRIEND","ORANGE","PLANET","SECRET"],
 emoji:["CAT","DOG","SUN","MAP","BOX","BOOK","GAME","STAR","MOON","FISH","APPLE","WATER","HAPPY","HOUSE","LIGHT","SCHOOL","FRIEND","ORANGE","PLANET","SECRET"],
 reverse:["HAT","CUP","KEY","BED","FOX","SHIP","BALL","CAKE","HAND","KING","HEART","MUSIC","PIZZA","ROBOT","TIGER","BANANA","CAMERA","CASTLE","MONKEY","FAMILY"],
 mixed:["TOP","RUN","ICE","PIG","JAM","DOOR","BLUE","GOLD","PARK","RICE","BLACK","WHITE","DREAM","EARTH","MOUSE","FLOWER","BRIDGE","COOKIE","ROCKET","CIRCLE"]
};
const shifts=[1,2,3,4,5,2,4,1,3,5,4,2,5,3,1,2,5,3,4,1];
/* 第二關：固定替換字母。
   特別保留課堂的大腦轉轉轉範例：
   A → M、C → Q、T → F，因此 CAT → QMF、ACT → MQF。 */
const substitutionAlphabet={
 A:"M",B:"T",C:"Q",D:"S",E:"C",F:"R",G:"G",H:"P",I:"U",J:"O",K:"Z",L:"H",M:"K",
 N:"B",O:"W",P:"N",Q:"L",R:"Y",S:"E",T:"F",U:"V",V:"I",W:"J",X:"A",Y:"D",Z:"X"
};

function shiftWord(word,n){return [...word].map(ch=>String.fromCharCode((ch.charCodeAt(0)-65+n+26)%26+65)).join("")}
function encodeSubstitution(word){return [...word].map(ch=>substitutionAlphabet[ch]).join("")}
function buildLevels(mode){
 return wordSets[mode].map((plain,i)=>{
   if(mode==="caesar"){const n=shifts[i];return {mode,p:plain,c:shiftWord(plain,n),shift:n}}
   if(mode==="emoji")return {mode,p:plain,c:encodeSubstitution(plain)};
   if(mode==="reverse")return {mode,p:plain,c:[...plain].reverse().join("")};
   const n=shifts[i];const reversed=[...plain].reverse().join("");return {mode,p:plain,c:shiftWord(reversed,n),shift:n};
 });
}
const allLevels={
 caesar:buildLevels("caesar"),
 substitution:buildLevels("emoji"),
 reverse:buildLevels("reverse"),
 mixed:buildLevels("mixed")
};
const groups={
 caesar_easy:allLevels.caesar.slice(0,10),caesar_hard:allLevels.caesar.slice(10,20),
 substitution_easy:allLevels.substitution.slice(0,10),substitution_hard:allLevels.substitution.slice(10,20),
 reverse_easy:allLevels.reverse.slice(0,10),reverse_hard:allLevels.reverse.slice(10,20),
 mixed_easy:allLevels.mixed.slice(0,10),mixed_hard:allLevels.mixed.slice(10,20)
};
const externalGames={
 cia_arcade:{title:labels.cia_arcade,file:"game-cia-arcade.html"},
 password_strength:{title:labels.password_strength,file:"game-password-strength.html"},
 digital_safety:{title:labels.digital_safety,file:"game-digital-safety-service.html"},
 judgment:{title:labels.judgment,file:"game-judgment.html"},
 secretclue:{title:labels.secretclue,file:"game-secret-clue.html"},
 playfair_easy:{title:labels.playfair_easy,file:"game-playfair.html?level=easy"},
 playfair_hard:{title:labels.playfair_hard,file:"game-playfair.html?level=hard"},
 suzhou_easy:{title:labels.suzhou_easy,file:"game-suzhou.html?level=easy"},
 suzhou_hard:{title:labels.suzhou_hard,file:"game-suzhou.html?level=hard"},
 bookcipher_easy:{title:labels.bookcipher_easy,file:"game-book-cipher.html?level=easy"},
 bookcipher_hard:{title:labels.bookcipher_hard,file:"game-book-cipher.html?level=hard"},
 suzhoubook_easy:{title:labels.suzhoubook_easy,file:"game-suzhou-book.html?level=easy"},
 suzhoubook_hard:{title:labels.suzhoubook_hard,file:"game-suzhou-book.html?level=hard"}
};

function emptyOpen(){return Object.fromEntries(GAME_IDS.map(id=>[id,false]))}
function normalizeState(v){
 const out=emptyOpen();
 if(v && typeof v==="object"){
   GAME_IDS.forEach(id=>out[id]=!!v[id]);
   // 舊版相容：若 Firebase 還留著舊的四個代號，就同時開啟簡單＋困難。
   if(v.caesar){out.caesar_easy=true;out.caesar_hard=true}
   if(v.emoji){out.substitution_easy=true;out.substitution_hard=true}
   if(v.reverse){out.reverse_easy=true;out.reverse_hard=true}
   if(v.mixed){out.mixed_easy=true;out.mixed_hard=true}
   if(v.playfair){out.playfair_easy=true;out.playfair_hard=true}
   if(v.suzhou){out.suzhou_easy=true;out.suzhou_hard=true}
   if(v.bookcipher){out.bookcipher_easy=true;out.bookcipher_hard=true}
   if(v.suzhoubook){out.suzhoubook_easy=true;out.suzhoubook_hard=true}
   return out;
 }
 if(v==="all")GAME_IDS.forEach(id=>out[id]=true);
 else{
   const legacy={
     caesar:["caesar_easy","caesar_hard"],
     emoji:["substitution_easy","substitution_hard"],
     reverse:["reverse_easy","reverse_hard"],
     mixed:["mixed_easy","mixed_hard"]
   };
   if(legacy[v])legacy[v].forEach(id=>out[id]=true);
   else if(GAME_IDS.includes(v))out[v]=true;
 }
 return out;
}
function openIds(){return GAME_IDS.filter(id=>openGames[id])}
function show(view){["entryView","teacherView","studentView"].forEach(id=>$(id).classList.add("hidden"));$(view).classList.remove("hidden")}

$("enterBtn").onclick=async()=>{
 const pw=$("entryPassword").value.trim();$("entryError").textContent="";
 if(!pw){show("studentView");refreshStudent(true);return}
 try{await signInWithEmailAndPassword(auth,TEACHER_EMAIL,pw);$("entryPassword").value="";show("teacherView")}
 catch(e){$("entryError").textContent="教師密碼錯誤，請再試一次。"}
};
$("entryPassword").addEventListener("keydown",e=>{if(e.key==="Enter")$("enterBtn").click()});
$("backEntry1").onclick=()=>show("entryView");$("backEntry2").onclick=()=>show("entryView");
$("teacherLogout").onclick=async()=>{await signOut(auth);show("entryView")};
onAuthStateChanged(auth,user=>{isTeacher=!!user;$("teacherSync").textContent=isTeacher?"☁️ 教師已登入，點遊戲即可開啟／關閉":"🔒 尚未登入教師帳號"});

async function writeOpen(next){
 if(!isTeacher){alert("教師登入已失效，請重新登入。");return}
 try{await set(classRef,next)}catch(e){alert("無法更新課堂狀態，請確認 Firebase 連線與 Rules。")}
}
document.querySelectorAll(".station-btn").forEach(b=>b.onclick=()=>{const next={...openGames,[b.dataset.mode]:!openGames[b.dataset.mode]};writeOpen(next)});
$("lockAll").onclick=()=>writeOpen(emptyOpen());
$("openAll").onclick=()=>writeOpen(Object.fromEntries(GAME_IDS.map(id=>[id,true])));
function setLesson(ids,value){
 const next={...openGames};
 ids.forEach(id=>next[id]=value);
 writeOpen(next);
}
$("lesson1Open").onclick=()=>setLesson(LESSON1_IDS,true);
$("lesson1Close").onclick=()=>setLesson(LESSON1_IDS,false);
$("lesson2Open").onclick=()=>setLesson(LESSON2_IDS,true);
$("lesson2Close").onclick=()=>setLesson(LESSON2_IDS,false);
$("lesson3EasyOpen").onclick=()=>setLesson(LESSON3_EASY,true);
$("lesson3HardOpen").onclick=()=>setLesson(LESSON3_HARD,true);
$("lesson3Close").onclick=()=>setLesson(LESSON3_IDS,false);


onValue(classRef,snap=>{
 openGames=normalizeState(snap.val());
 const ids=openIds();
 $("teacherStatus").textContent=ids.length?`目前開放 ${ids.length} 個：${ids.map(id=>labels[id]).join("、")}`:"目前開放：無";
 document.querySelectorAll(".station-btn").forEach(b=>b.classList.toggle("active",!!openGames[b.dataset.mode]));
 refreshStudent(false);
},err=>{$("teacherStatus").textContent="⚠️ 無法讀取課堂狀態";console.error(err)});

function hideStudentAreas(){
 $("waitingCard").classList.add("hidden");$("gameMenu").classList.add("hidden");$("gameCard").classList.add("hidden");$("externalGameWrap").classList.add("hidden");
}
function renderMenu(){
 hideStudentAreas();const ids=openIds();
 if(!ids.length){$("waitingCard").classList.remove("hidden");$("externalGameFrame").src="about:blank";currentMode=null;return}
 $("gameMenu").classList.remove("hidden");
 $("menuHint").textContent=ids.length===1?"老師目前開放 1 個遊戲。":"老師目前開放以下遊戲。";
 const lesson1=ids.filter(id=>LESSON1_IDS.includes(id)),lesson2=ids.filter(id=>LESSON2_IDS.includes(id)),lesson3=ids.filter(id=>LESSON3_IDS.includes(id));
 const section=(title,list)=>list.length?`<div style="grid-column:1/-1;font-weight:1000;font-size:19px;margin-top:6px">${title}</div>`+list.map(id=>{const [ic,nm]=labelParts(id);return `<button class="student-game-btn ${cardClass(id)}" data-student-mode="${id}"><span class="ico">${ic}</span><b>${nm}</b><span>${subtitles[id]}</span></button>`}).join(""):"";
 $("studentGameGrid").innerHTML=section("📁 第一堂｜網路安全大冒險",lesson1)+section("📁 第二堂｜古典密碼學基礎",lesson2)+section("📁 第三堂｜古典密碼學進階",lesson3);
 $("studentGameGrid").querySelectorAll(".student-game-btn").forEach(b=>b.onclick=()=>launchStudentMode(b.dataset.studentMode));
 $("externalGameFrame").src="about:blank";currentMode=null;
}
function refreshStudent(force){
 if($("studentView").classList.contains("hidden"))return;
 const ids=openIds();
 if(currentMode && !openGames[currentMode]){renderMenu();return}
 if(force || !currentMode)renderMenu();
}
function launchStudentMode(mode){
 if(!openGames[mode]){renderMenu();return}
 currentMode=mode;hideStudentAreas();
 if(externalGames[mode]){
   $("externalGameWrap").classList.remove("hidden");$("externalGameTitle").textContent=externalGames[mode].title;
   $("externalGameFrame").src="about:blank";setTimeout(()=>{$("externalGameFrame").src=externalGames[mode].file},20);return;
 }
 $("gameCard").classList.remove("hidden");currentLevels=groups[mode];qIndex=0;studentScore=0;$("gameScore").textContent=0;renderGame();
}
$("backMenuBuiltIn").onclick=renderMenu;$("backMenuExternal").onclick=renderMenu;

function buildKeyboard(){
 const kb=$("keyboard");kb.innerHTML="";
 "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch=>{const b=document.createElement("button");b.className="key";b.type="button";b.textContent=ch;b.onclick=()=>{if(!answered)$("answer").value+=ch};kb.appendChild(b)});
 const bk=document.createElement("button");bk.className="key special";bk.type="button";bk.textContent="⌫";bk.onclick=()=>{if(!answered)$("answer").value=$("answer").value.slice(0,-1)};kb.appendChild(bk);
}
function caesarExamples(n){
 const pairs=[["A",shiftWord("A",n)],["B",shiftWord("B",n)],["C",shiftWord("C",n)]];
 return pairs.map(([a,b])=>`<span class="patternchip">${a} → ${b}</span>`).join("");
}
function substitutionExamples(word){
 // 第一題直接呼應 PPT 的「CAT → QMF、ACT → MQF、TAC → ?」
 if(word==="CAT"){
   return `<span class="patternchip">ACT → ${encodeSubstitution("ACT")}</span><span class="patternchip">TAC → ${encodeSubstitution("TAC")}</span>`;
 }
 // 其他題只提供相同字母的不同排列，讓學生自行觀察固定替換關係。
 const chars=[...word];
 const ex1=[...chars.slice(1),chars[0]].join("");
 const ex2=[chars[chars.length-1],...chars.slice(0,-1)].join("");
 return `<span class="patternchip">${ex1} → ${encodeSubstitution(ex1)}</span><span class="patternchip">${ex2} → ${encodeSubstitution(ex2)}</span>`;
}
function reverseExamples(){return `<span class="patternchip">CAT → TAC</span><span class="patternchip">DOG → GOD</span>`}
function mixedExamples(n){return `<div class="step"><span class="stepno">①</span><span class="patternchip">CAT → TAC</span></div><div class="step"><span class="stepno">②</span>${caesarExamples(n)}</div>`}

function renderGame(){
 const l=currentLevels[qIndex],baseMode=l.mode;answered=false;$("answer").value="";$("answer").disabled=false;
 $("gameProgress").style.width=`${qIndex/currentLevels.length*100}%`;$("cipherText").textContent=l.c;$("gameTitle").textContent=labels[currentMode];$("gameSub").textContent=`第 ${qIndex+1} / ${currentLevels.length} 題｜${l.p.length} 個字母`;
 let pattern="";
 if(baseMode==="caesar")pattern=caesarExamples(l.shift);
 else if(baseMode==="emoji")pattern=substitutionExamples(l.p);
 else if(baseMode==="reverse")pattern=reverseExamples();
 else pattern=mixedExamples(l.shift);
 $("patternRow").innerHTML=pattern;
 $("feedback").className="feedback info";$("feedback").textContent="觀察上面的規則，再解開密文。";
 $("checkBtn").classList.remove("hidden");$("nextBtn").classList.add("hidden");$("clearBtn").disabled=false;
}
function checkAnswer(){
 if(answered)return;const l=currentLevels[qIndex],ans=$("answer").value.trim().toUpperCase();
 if(!ans){$("feedback").className="feedback bad";$("feedback").textContent="還沒有輸入答案喔！";return}
 answered=true;$("answer").disabled=true;$("clearBtn").disabled=true;
 if(ans===l.p){studentScore+=10;$("gameScore").textContent=studentScore;$("feedback").className="feedback good";$("feedback").innerHTML=`✅ <b>${l.p}</b>　+10 分`}
 else{$("feedback").className="feedback bad";$("feedback").innerHTML=`❌ 正確答案：<b>${l.p}</b>`}
 $("checkBtn").classList.add("hidden");$("nextBtn").classList.remove("hidden");
}
$("clearBtn").onclick=()=>{if(!answered)$("answer").value=""};$("checkBtn").onclick=checkAnswer;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
$("nextBtn").onclick=()=>{if(qIndex<currentLevels.length-1){qIndex++;renderGame()}else{$("gameProgress").style.width="100%";$("feedback").className="feedback good";$("feedback").innerHTML=`🎉 完成 ${currentLevels.length} 題！你得到 <b>${studentScore} / 100 分</b>。`;$("nextBtn").classList.add("hidden")}};
buildKeyboard();
</script>
