<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>蘇州碼子快問快答</title><style>
:root{--navy:#17283f;--muted:#65778a;--blue:#dff3ff;--pink:#ffe7f1;--yellow:#fff5bf;--green:#dcf8e7;--red:#ffe2e2;--lav:#eee8ff;--line:#d7e2eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--navy);background:#fff}
body{background:radial-gradient(circle at 7% 7%,#fff0f3 0 90px,transparent 91px),radial-gradient(circle at 94% 92%,#eaf7ff 0 105px,transparent 106px),#fff}
button,input{font:inherit}.hidden{display:none!important}.app{width:min(1120px,96vw);margin:16px auto 30px}
.card{background:#fff;border:3px solid var(--navy);border-radius:22px;box-shadow:0 8px 0 rgba(23,40,63,.10)}
.header{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-bottom:14px}.brand{padding:18px 22px}.brand h1{margin:0;font-size:clamp(28px,4vw,44px)}.brand p{margin:7px 0 0;color:var(--muted);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:11px}.stat{border:2px solid var(--line);border-radius:14px;background:#f5f8fc;text-align:center;padding:8px;font-weight:900}.stat b{display:block;font-size:24px;margin-top:2px}
.topbar{padding:13px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:22px;font-weight:1000}.sub{font-size:13px;color:var(--muted);font-weight:800;margin-top:3px}.pill{border:3px solid var(--navy);border-radius:999px;background:var(--yellow);padding:8px 14px;font-weight:1000;white-space:nowrap}
.progress{height:14px;background:#e8eef4;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}.progress>div{height:100%;background:#63bff0;width:0;transition:.25s}
.game{padding:18px}.challenge{border:3px solid var(--navy);border-radius:20px;background:#f8fbfe;padding:18px;text-align:center}.prompt{font-size:15px;color:var(--muted);font-weight:900}.big{font-size:clamp(30px,5vw,50px);font-weight:1000;margin:10px 0;letter-spacing:3px;word-break:break-word}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.btn{border:3px solid var(--navy);border-radius:14px;padding:11px 20px;background:#fff;color:var(--navy);font-weight:1000;cursor:pointer}.btn.primary{background:var(--navy);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.feedback{margin-top:15px;border:3px solid var(--line);border-radius:17px;padding:13px 16px;min-height:74px;background:#f8fafc;line-height:1.55;font-size:16px}.feedback.info{background:#fff8d7;border-color:#dec15c}.feedback.good{background:var(--green);border-color:#72d99b}.feedback.bad{background:var(--red);border-color:#eb8585}
.overlay{position:fixed;inset:0;background:#102b44dc;z-index:10000;display:grid;place-items:center;padding:20px}.modal{width:min(820px,95vw);background:#fff;border:4px solid var(--navy);border-radius:26px;padding:24px;text-align:center;box-shadow:0 20px 0 rgba(0,0,0,.15)}.modal h1{font-size:clamp(32px,5vw,48px);margin:0 0 10px}.modal p{font-size:17px;line-height:1.65;color:#50667b}.result{font-size:52px;font-weight:1000;color:#e34665;margin:10px 0}
.answer-input{width:min(520px,100%);border:3px solid var(--navy);border-radius:14px;padding:11px 14px;font-size:25px;text-align:center;font-weight:1000;text-transform:uppercase;outline:none}.answer-input:focus{box-shadow:0 0 0 5px #bde8ff}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:760px;margin:14px auto 0}.choice{border:3px solid var(--navy);border-radius:15px;padding:13px;background:#fff;font-size:20px;font-weight:1000;cursor:pointer}.choice:hover{background:var(--blue)}
@media(max-width:780px){.header{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}

.legend{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:14px auto;max-width:900px}.legend div{border:2px solid var(--navy);border-radius:10px;padding:8px 4px;background:#fff;font-weight:1000}@media(max-width:780px){.legend{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="app"><div class="header"><section class="card brand"><h1>〧 蘇州碼子快問快答</h1><p>把數字換外衣，再把外衣翻回數字</p></section><section class="card stats"><div class="stat">⭐ 分數<b id="score">0</b></div><div class="stat">🧩 題目<b id="qno">1 / 20</b></div><div class="stat">✅ 答對<b id="correct">0</b></div><div class="stat">🎯 每題<b>5 分</b></div></section></div>
<section class="card"><div class="topbar"><div><div class="title">先看對照表，再快速翻譯</div><div class="sub">今天把蘇州碼子當成「數字的外衣」。</div></div><div class="pill">滿分 100 分</div></div><div class="progress"><div id="progress"></div></div><div class="game"><div class="challenge">
<div class="legend"><div>1<br>〡</div><div>2<br>〢</div><div>3<br>〣</div><div>4<br>〤</div><div>5<br>〥</div><div>6<br>〦</div><div>7<br>〧</div><div>8<br>〨</div><div>9<br>〩</div></div>
<div class="prompt" id="mode"></div><div class="big" id="question"></div><input class="answer-input" id="answer" placeholder="輸入答案">
<div class="actions"><button class="btn" id="clearBtn">↻ 清除</button><button class="btn primary" id="checkBtn">確定答案 ✓</button><button class="btn primary hidden" id="nextBtn">下一題 ▶</button></div><div class="feedback info" id="feedback">可以看對照表，不用硬背。</div></div></div></section></div>
<div class="overlay" id="start"><div class="modal"><h1>〧 蘇州碼子任務</h1><p>20 題，每題 5 分。<br>前 10 題把符號換回數字，後 10 題把數字換成蘇州碼子。</p><button class="btn primary" id="startBtn">開始 ▶</button></div></div>
<div class="overlay hidden" id="end"><div class="modal"><h1>🎉 任務完成</h1><div class="result" id="finalScore"></div><p id="finalText"></p><button class="btn primary" id="againBtn">再玩一次</button></div></div>
<script>
const qs=[{"mode": "符號→數字", "q": "〢", "a": "2"}, {"mode": "符號→數字", "q": "〤", "a": "4"}, {"mode": "符號→數字", "q": "〧", "a": "7"}, {"mode": "符號→數字", "q": "〩", "a": "9"}, {"mode": "符號→數字", "q": "〣", "a": "3"}, {"mode": "符號→數字", "q": "〦", "a": "6"}, {"mode": "符號→數字", "q": "〨", "a": "8"}, {"mode": "符號→數字", "q": "〥", "a": "5"}, {"mode": "符號→數字", "q": "〡", "a": "1"}, {"mode": "符號→數字", "q": "〢〤", "a": "24"}, {"mode": "數字→符號", "q": "35", "a": "〣〥"}, {"mode": "數字→符號", "q": "18", "a": "〡〨"}, {"mode": "數字→符號", "q": "72", "a": "〧〢"}, {"mode": "數字→符號", "q": "49", "a": "〤〩"}, {"mode": "數字→符號", "q": "63", "a": "〦〣"}, {"mode": "數字→符號", "q": "27", "a": "〢〧"}, {"mode": "數字→符號", "q": "84", "a": "〨〤"}, {"mode": "數字→符號", "q": "91", "a": "〩〡"}, {"mode": "數字→符號", "q": "56", "a": "〥〦"}, {"mode": "數字→符號", "q": "32", "a": "〣〢"}];let i=0,score=0,correct=0,answered=false;const $=id=>document.getElementById(id);
function render(){let q=qs[i];answered=false;$("qno").textContent=`${i+1} / 20`;$("progress").style.width=`${i/20*100}%`;$("mode").textContent=q.mode;$("question").textContent=q.q;$("answer").value="";$("answer").disabled=false;$("feedback").className="feedback info";$("feedback").textContent="看對照表，再翻譯答案。";$("checkBtn").classList.remove("hidden");$("nextBtn").classList.add("hidden")}
function check(){if(answered)return;let q=qs[i],a=$("answer").value.trim();if(!a){$("feedback").className="feedback bad";$("feedback").textContent="還沒輸入答案喔！";return}answered=true;$("answer").disabled=true;if(a===q.a){score+=5;correct++;$("score").textContent=score;$("correct").textContent=correct;$("feedback").className="feedback good";$("feedback").innerHTML=`✅ 正確！<b>${q.q} → ${q.a}</b>　+5 分`}else{$("feedback").className="feedback bad";$("feedback").innerHTML=`❌ 正確答案：<b>${q.a}</b>`}$("checkBtn").classList.add("hidden");$("nextBtn").classList.remove("hidden")}
$("checkBtn").onclick=check;$("clearBtn").onclick=()=>{if(!answered)$("answer").value=""};$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});$("nextBtn").onclick=()=>{if(i<19){i++;render()}else finish()};function finish(){$("progress").style.width="100%";$("finalScore").textContent=`${score} 分`;$("finalText").textContent=`答對 ${correct} / 20 題。`;$("end").classList.remove("hidden")};$("startBtn").onclick=()=>{$("start").classList.add("hidden");i=0;score=0;correct=0;$("score").textContent=0;$("correct").textContent=0;render()};$("againBtn").onclick=()=>{i=0;score=0;correct=0;$("score").textContent=0;$("correct").textContent=0;$("end").classList.add("hidden");render()};render();
</script></body></html>
